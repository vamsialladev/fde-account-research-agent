[project]
name = "fde-account-research-agent"
version = "1.0.0"
description = "Pre-sales: a planner, researchers, a critic and a writer turn a hotel company's name into a cited discovery-prep brief"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vamsi Alla" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/research", "eval", "app"]
omit = ["scripts/make_captions.py"]
